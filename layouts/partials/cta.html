{{ $data := index hugo.Data site.Language.Lang }}

{{ if $data.cta.cta.enable}}
{{ with $data.cta.cta}}
{{"<!-- Start Call To Action -->" | safeHTML}}
<section id="cta" class="call-to-action section-sm bg-1 overly" {{ partial `bg-image.html` (dict `Src` .bg_image_webp ) | safeHTMLAttr }}>
	<!-- this image is for trigger this section fallback background image -->
	{{ partial "image" (dict "Src" .bg_image "Alt" .title "Class" "d-none") }}

	<div class="container">
		<div class="row">
			<div class="col-lg-12 text-center">
				<a href="{{ .link }}" class="community-link">{{ .title | markdownify }}</a>
			</div>
		</div>
	</div>
</section>
{{"<!-- /Call To Action -->" | safeHTML}}
{{ end }}
{{ end }}
